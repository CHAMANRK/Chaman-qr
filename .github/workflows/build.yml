name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup fixed keystore (optional)
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.p12"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/ks.p12" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ChamanQR-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release (public download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          cp app/build/outputs/apk/debug/app-debug.apk chaman-qr.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest chaman-qr.apk --target "$GITHUB_SHA" --prerelease \
            --title "Chaman QR v$VER (build $GITHUB_RUN_NUMBER)" \
            --notes "Latest debug APK. Direct link: https://github.com/$GITHUB_REPOSITORY/releases/download/latest/chaman-qr.apk"
